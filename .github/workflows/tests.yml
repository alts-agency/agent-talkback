name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pip-audit
      - name: Tests (no test makes a sound)
        run: python -m unittest discover -s tests -v
      - name: Icon assets are generated, never hand-edited
        run: python tools/build_assets.py --check
      - name: Pinned dependencies have no known advisories
        run: pip-audit -r requirements.txt
