<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Talkback — social preview</title>
<!--
  The source of assets/social-preview.png. Render this page at exactly 1280x640 (no scrollbars, no device scaling)
  and upload the PNG under the repository's Settings -> Social preview. Nothing is loaded from the network: the
  lockup is the site's own ">/" — the chevron in white, the slash in the brand's mint — set tight, and the type is
  Windows' system font.
-->
<style>
  :root {
    --ink: #000000;
    --paper: #ffffff;
    --muted: #9ba1ac;
    --mint: #8fcfc2;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: var(--ink); }
  body {
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, Arial, sans-serif;
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  main { display: flex; flex-direction: column; align-items: center; }
  .lockup { display: flex; align-items: baseline; font-size: 46px; font-weight: 700; line-height: 1; }
  .lockup .chev { color: var(--paper); letter-spacing: -0.09em; }
  .lockup .slash { color: var(--mint); margin-left: 1px; }
  h1 { font-size: 84px; font-weight: 600; letter-spacing: -0.035em; line-height: 1; margin-top: 18px; }
  .tagline { margin-top: 16px; }
  .tagline span {
    display: inline-block;
    background: var(--mint);
    color: var(--ink);
    font-size: 26px;
    font-weight: 500;
    letter-spacing: -0.005em;
    padding: 3px 12px 4px;
    border-radius: 2px;
  }
  .site { margin-top: 26px; font-size: 23px; color: var(--muted); letter-spacing: 0.01em; }
</style>
</head>
<body>
  <main>
    <div class="lockup" aria-label="Alts Agency"><span class="chev">&gt;</span><span class="slash">/</span></div>
    <h1>Agent Talkback</h1>
    <p class="tagline"><span>Speaks your agents&rsquo; replies on Windows.</span></p>
    <div class="site">www.alts.agency</div>
  </main>
</body>
</html>
